    <!-- No static description meta tag here on purpose. React Helmet renders
         one per page via src/components/Seo.tsx; a hard-coded tag in this file
         is not Helmet-managed, so it would survive alongside the real one and
         leave every page emitting two competing descriptions. -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="The Divvy — Lovejoy reviews"
      href="/feed.xml"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>The Divvy — Lovejoy reviews, weekly</title>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="d03990be-4856-454a-8883-ce56ea144d3b"
      data-domains="thedivvy.co.uk,www.thedivvy.co.uk"
    ></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
